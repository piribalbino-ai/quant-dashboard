<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quant">
<meta name="theme-color" content="#161b22">
<title>Quant Dashboard</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg:      #0d1117;
    --surface: #161b22;
    --border:  #21262d;
    --text:    #c9d1d9;
    --muted:   #8b949e;
    --accent:  #58a6ff;
    --green:   #2ecc71;
    --yellow:  #f1c40f;
    --radius:  12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom, 16px);
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 12px;
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header .logo { font-size: 1.6rem; }
  header h1 { font-size: 1.05rem; color: #e6edf3; font-weight: 700; }
  header .sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

  /* ── Main grid ── */
  main {
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    max-width: 600px;
    margin: 0 auto;
  }
  @media (min-width: 540px) {
    main { grid-template-columns: 1fr 1fr; }
  }
  @media (min-width: 900px) {
    main { grid-template-columns: 1fr 1fr 1fr; max-width: 960px; }
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color .2s, box-shadow .2s;
  }
  .card:hover { border-color: #30363d; box-shadow: 0 4px 20px rgba(0,0,0,.4); }
  .card.active { border-color: rgba(46,204,113,.35); }

  .card-top {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .icon { font-size: 1.8rem; line-height: 1; flex-shrink: 0; }
  .card-info { flex: 1; }
  .card-name { font-size: .95rem; font-weight: 600; color: #e6edf3; }
  .card-desc { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.4; }

  /* ── Badge ── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    letter-spacing: .03em;
    width: fit-content;
  }
  .badge.active  { background: rgba(46,204,113,.15); color: var(--green); }
  .badge.dev     { background: rgba(241,196,15,.12);  color: var(--yellow); }
  .badge .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: currentColor;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%      { opacity: .35; }
  }

  /* ── Button ── */
  .btn {
    display: block;
    width: 100%;
    padding: 9px 0;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    margin-top: 4px;
  }
  .btn:active { transform: scale(.97); }
  .btn.open { background: var(--accent); color: #000; }
  .btn.soon { background: var(--border); color: var(--muted); cursor: default; }

  /* ── Progress bar ── */
  .progress-wrap { display: flex; flex-direction: column; gap: 3px; }
  .progress-label { font-size: 10px; color: var(--muted); }
  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    border-radius: 2px;
  }

  /* ── Footer ── */
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    padding: 24px 16px env(safe-area-inset-bottom, 16px);
  }
</style>
</head>
<body>

<header>
  <span class="logo">📊</span>
  <div>
    <h1>Quant Dashboard</h1>
    <div class="sub">Pipeline quantitativo multi-mercado</div>
  </div>
</header>

<main id="grid"></main>

<footer>
  Atualizado automaticamente &nbsp;·&nbsp; <span id="ts"></span>
</footer>

<script>
const MODULES = [
  {
    icon: "₿",
    name: "On-Chain Analytics",
    desc: "BTC/ETH métricas e sinais de ciclo",
    status: "active",
    href: "./onchain/index.html",
    progress: 100,
  },
  {
    icon: "📈",
    name: "Screening Global",
    desc: "Valuations B3, EUA, Europa, China",
    status: "active",
    href: "./screening/index.html",
    progress: 70,
  },
  {
    icon: "🔍",
    name: "Rug / Gem Detection",
    desc: "ETH · BSC · BASE · Solana",
    status: "active",
    href: "./rug-gem/index.html",
    progress: 60,
  },
  {
    icon: "🌾",
    name: "WASDE / COT / EIA",
    desc: "NLP em relatórios agrícolas e energia",
    status: "dev",
    href: null,
    progress: 10,
  },
  {
    icon: "🗞️",
    name: "NLP Geopolítico",
    desc: "Energia e metais em tempo real",
    status: "dev",
    href: null,
    progress: 8,
  },
  {
    icon: "🛢️",
    name: "Spread Trading",
    desc: "Crack spread, spark spread, soja-farelo",
    status: "dev",
    href: null,
    progress: 12,
  },
  {
    icon: "📊",
    name: "Factor Cross-Commodity",
    desc: "Momentum, carry e basis",
    status: "dev",
    href: null,
    progress: 5,
  },
  {
    icon: "🌦️",
    name: "Clima como Feature ML",
    desc: "Dados climáticos para agrícolas",
    status: "dev",
    href: null,
    progress: 5,
  },
  {
    icon: "💧",
    name: "Liquidation Heatmaps",
    desc: "Mapa de liquidações em perps",
    status: "dev",
    href: null,
    progress: 15,
  },
  {
    icon: "🏛️",
    name: "Governança DeFi",
    desc: "NLP em proposals de protocolos",
    status: "dev",
    href: null,
    progress: 5,
  },
  {
    icon: "📉",
    name: "Options Flow",
    desc: "Fluxo institucional em opções",
    status: "dev",
    href: null,
    progress: 8,
  },
];

function renderCard(m) {
  const isActive = m.status === "active";

  const badge = isActive
    ? `<span class="badge active"><span class="dot"></span>Ativo</span>`
    : `<span class="badge dev"><span class="dot"></span>Em desenvolvimento</span>`;

  const progress = !isActive ? `
    <div class="progress-wrap">
      <div class="progress-label">Progresso: ${m.progress}%</div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${m.progress}%"></div>
      </div>
    </div>` : "";

  const btn = isActive
    ? `<a class="btn open" href="${m.href}">Abrir</a>`
    : `<span class="btn soon">Em breve</span>`;

  return `
    <div class="card${isActive ? ' active' : ''}">
      <div class="card-top">
        <span class="icon">${m.icon}</span>
        <div class="card-info">
          <div class="card-name">${m.name}</div>
          <div class="card-desc">${m.desc}</div>
        </div>
      </div>
      ${badge}
      ${progress}
      ${btn}
    </div>`;
}

document.getElementById("grid").innerHTML = MODULES.map(renderCard).join("");
document.getElementById("ts").textContent = new Date().toLocaleString("pt-BR", {
  timeZone: "America/Sao_Paulo",
  day: "2-digit", month: "2-digit", year: "numeric",
  hour: "2-digit", minute: "2-digit",
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
